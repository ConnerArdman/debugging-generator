<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#475569">
  <!-- A cordless drill in side profile, nose to the right: housing and grip are one closed
       outline rather than two stacked boxes, so the asymmetric L holds at 16 px, and the
       quadratic corners turn as round as the joins. The bar off the nose reads as a bit, not
       an arrow, only because of the collar tick at its root. The root strokes with the
       currentColor keyword over a slate root colour: fetched by its path the file is its own
       document and resolves that keyword against itself, yet inherits inlined. -->
