<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#475569">
  <!-- Hex nut category glyph, used as a CSS mask by the category glyph component, so its alpha is
       the shape. Keep it fill-free at the family's 1.75 stroke and legible at 16 px. Viewed on its
       own, currentColor resolves to the slate root colour. Stroked and pointy-top, so it never
       reads as the filled flat-top brand mark. -->
  <path d="M12 3.5 L19.36 7.75 L19.36 16.25 L12 20.5 L4.64 16.25 L4.64 7.75 Z" />
  <circle cx="12" cy="12" r="3.2" />
</svg>
