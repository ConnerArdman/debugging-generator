<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40" role="img">
  <title>Lumen Supply</title>
  <!-- Horizontal brand lockup, 200 x 40: the mark of favicon.svg on the left, the two-tone wordmark on the right. Intrinsic width and height sit on the root beside the view box, so a consumer that references this file by its string path - <img src="/logo.svg" width="200" height="40" alt="Lumen Supply"> - gets the aspect ratio without a static import. -->
  <!-- Mark: the two concentric flat-top regular hexagons of favicon.svg, reused verbatim and inset by 4 so the 32-unit mark occupies x 4-36, y 4-36 and its centre lands on 20 20 - the middle of the 40-unit height. Outer hexagon circumradius 15 in ink, amber core circumradius 7 (0.47 of the outer), both centred at 16 16 of the mark's own box, corners filleted with a quadratic join. -->
  <g transform="translate(4 4)">
    <path d="M10.9 3.01 L21.1 3.01 Q23.5 3.01 24.7 5.09 L29.8 13.92 Q31 16 29.8 18.08 L24.7 26.91 Q23.5 28.99 21.1 28.99 L10.9 28.99 Q8.5 28.99 7.3 26.91 L2.2 18.08 Q1 16 2.2 13.92 L7.3 5.09 Q8.5 3.01 10.9 3.01 Z" fill="#0F172A" />
    <path d="M13.62 9.94 L18.38 9.94 Q19.5 9.94 20.06 10.91 L22.44 15.03 Q23 16 22.44 16.97 L20.06 21.09 Q19.5 22.06 18.38 22.06 L13.62 22.06 Q12.5 22.06 11.94 21.09 L9.56 16.97 Q9 16 9.56 15.03 L11.94 10.91 Q12.5 9.94 13.62 9.94 Z" fill="#F59E0B" />
  </g>
  <!-- Wordmark: one text element, set on an explicit 26 baseline 10 units clear of the mark. At size 19 the cap line falls near y 12 and the descender of the final letter near y 30, so the words clear the box top and bottom at every rendered size. Weight and colour carry the whole typographic idea: the first word is ink at 600, the second slate at 400, and each stays legible on its own if colour is lost. The family list is a platform stack - nothing is embedded or fetched - so advances differ per reader and the nominal end near x 186 leaves the rest of the 200 units as slack; widening the text or pinning it with a fixed text-length attribute would clip it or distort the letterforms. -->
  <text x="46" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="-0.2">
    <tspan fill="#0F172A" font-weight="600">Lumen</tspan>
    <tspan fill="#475569" font-weight="400"> Supply</tspan>
  </text>
</svg>
