<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>Hand tools</title>
  <!-- Every tile here shares this panel, shelf, view box and intrinsic size, so tiles referenced
       by path swap without reflow. Colours are explicit hex, as an img inherits none. Mist stays
       background and amber only fills outlines: neither reads on the panel alone. -->
  <rect x="0" y="0" width="400" height="300" rx="12" fill="#F8FAFC" />
  <path d="M40 232 H360" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
  <path d="M96 232 V212" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
  <path d="M304 232 V212" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
  <g fill="none" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-61 202 151)">
    <circle cx="200" cy="88" r="14" />
    <path d="M200 102 V190" />
    <path d="M186 216 V202 Q186 190 200 190 Q214 190 214 202 V216" />
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(52 191 136)">
    <path d="M170 50 H230 V112 H178 V98 H200 V66 L170 58 Z" stroke="#0F172A" stroke-width="8" />
    <path d="M194 155 L202 236 A8 8 0 0 0 218 236 L226 155" stroke="#0F172A" stroke-width="8" />
    <rect x="190" y="118" width="40" height="44" rx="6" fill="#F59E0B" stroke="#475569" stroke-width="6" />
    <path d="M199 128 H221 M199 140 H221 M199 152 H221" stroke="#475569" stroke-width="6" />
