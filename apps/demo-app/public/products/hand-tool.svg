<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>Hand tools</title>
  <!-- One of the six object tiles of the catalog, cycled across products by the seed data. The
       frame - the rounded paper panel, the shelf stroke and its two uprights, the 400 x 300 view
       box and the intrinsic width and height on the root - is the one product-placeholder.svg
       establishes and is identical in all seven files, so a catalog card or the product gallery can
       swap one tile for another without reflowing. The root carries that width and height because
       consumers reference this file by its string path alone - an img element, or a next/image with
       a literal src - and so have no import from which a size could be inferred. -->
  <!-- Palette, written as explicit hex because an image loaded through an img element inherits no
       colour from the page. Ink #0F172A carries the subject at the heaviest weight in the file;
       slate #475569 the secondary line work; mist #CBD5E1 the shelf and the tool behind the
       subject and nothing in front of it, since at 1.42:1 against the panel it would leave the
       tile looking blank at card size; paper #F8FAFC the panel itself; and one amber #F59E0B
       accent, filled and bounded by a slate outline rather than stroked on its own, for that same
       contrast reason. Round caps and joins sit on each wrapping group, so every stroke inherits
       them. -->
  <rect x="0" y="0" width="400" height="300" rx="12" fill="#F8FAFC" />
  <path d="M40 232 H360" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
  <path d="M96 232 V212" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
  <path d="M304 232 V212" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
  <!-- The rest of the background motif, and the tile's depth cue: a second tool laid across the
       opposite diagonal - a ring end, a shaft and an open jaw. It is drawn at the shelf's own mist
       weight and before the subject, so the subject's strokes and its filled barrel pass over the
       shaft where the two cross and the pair reads as one behind the other. Authored upright, ring
       at the top of its axis, and turned once about 202 151, which sends the ring to the upper left
       and the jaw to the lower right. -->
  <g fill="none" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-61 202 151)">
    <circle cx="200" cy="88" r="14" />
    <path d="M200 102 V190" />
    <path d="M186 216 V202 Q186 190 200 190 Q214 190 214 202 V216" />
  </g>
  <!-- The subject: one adjustable wrench, authored upright about the same vertical axis - every
       edge square to it, so the geometry below reads as the plain rectangles it is - and turned
       once, 52 degrees about 191 136. That lays it on a gentle lower-left to upper-right diagonal,
       its tip just above the shelf near 118 218 and its jaw near 264 90, clear of the artwork
       area's edges and of both shelf uprights. One tool at this weight and not two: a second ink
       silhouette would turn to mush at card size, which is why the tool behind stays in mist. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(52 191 136)">
    <!-- The head, as a single outline: a body squared to the handle, a jaw out of either corner of
         it, and between them the mouth, opening across the handle rather than along it. The jaws
         are slim on purpose - 16 and 14 deep against a stroke of 8 - so the hollow inside each one
         stays a hairline and the mouth, 32 at its back wall and 40 at the opening, is the only wide
         gap in the head; jaws deep enough to enclose a gap of their own turn the outline into
         nested boxes at card size, which reads as a maze and not a tool. The fixed upper jaw
         reaches 8 further out than the movable lower one and narrows to solid ink at its tip - the
         offset, and the flare, of jaws set apart. -->
    <path d="M170 50 H230 V112 H178 V98 H200 V66 L170 58 Z" stroke="#0F172A" stroke-width="8" />
    <!-- The handle, drawn before the barrel so the barrel closes the joint over its upper ends: a
         form tapering from 32 across under the barrel to 16 at the tip, where a half circle of
         radius 8 turns one edge into the other. -->
    <path d="M194 155 L202 236 A8 8 0 0 0 218 236 L226 155" stroke="#0F172A" stroke-width="8" />
    <!-- The adjuster, and the one accent: a barrel seated between head and handle, filled amber
         inside its slate outline, with three slate ridges across it for the knurl. -->
    <rect x="190" y="118" width="40" height="44" rx="6" fill="#F59E0B" stroke="#475569" stroke-width="6" />
    <path d="M199 128 H221 M199 140 H221 M199 152 H221" stroke="#475569" stroke-width="6" />
  </g>
</svg>
