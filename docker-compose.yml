# PostgreSQL for the "Lumen Supply" demo application.
#
# Only the database runs in Docker; the product itself (the VS Code extension,
# the local coordination service, the Chrome extension and the demo app) runs on
# the host, so this file defines exactly one service and nothing else.
#
# Usage:
#   pnpm demo:db           start it in the background (docker compose up -d postgres)
#   pnpm demo:migrate      apply the demo's Prisma migrations to it
#   pnpm demo:seed         load the demo data set
#   docker compose stop    stop it, keeping the data volume
#   docker compose down -v stop it and discard the data volume
#
# The user, password, database and port below are the ones DATABASE_URL in
# .env.example already points at, so `pnpm demo:db` needs no configuration.
services:
  postgres:
    image: postgres:18.6-alpine
    # Deliberately no `container_name:`. Compose names the container
    # `<project>-postgres-1` and the volume `<project>_postgres-data`, where the
    # project is the checkout directory's name unless COMPOSE_PROJECT_NAME
    # overrides it, so every checkout or worktree gets its own container and its
    # own volume. A fixed name would make a second checkout's `pnpm demo:db` fail
    # on a name conflict; running one side by side needs only its own
    # POSTGRES_PORT.
    restart: unless-stopped
    # Stock image defaults: no `command:` override and no server tuning (such as
    # shared_buffers, work_mem, fsync or planner settings), so the query timings
    # Debug Generator captures come from PostgreSQL as it ships, untuned.
    #
    # The credentials below are local development placeholders, kept literal on
    # purpose: interpolating them (${POSTGRES_PASSWORD}) would break `pnpm
    # demo:db` on a fresh clone that has no .env, and docs/SECURITY.md documents
    # them as non-secret. Never put a real credential in this file.
    environment:
      POSTGRES_USER: debuggen
      POSTGRES_PASSWORD: debuggen
      POSTGRES_DB: lumen_supply
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory, so the
      # volume must be mounted at /var/lib/postgresql (NOT .../data, which the
      # entrypoint rejects with "in 18+, these Docker images are configured to
      # store database data in a format which is compatible with pg_ctlcluster").
      # A named volume is used rather than a bind mount so that seeded data
      # never appears in the working tree and `git status` stays clean.
      - postgres-data:/var/lib/postgresql
    # Mirrors the CI service's health options so `pnpm demo:migrate` can rely on
    # the same readiness signal locally and in the pipeline.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debuggen -d lumen_supply"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
