packages:
  - "apps/*"
  - "packages/*"

# pnpm >=10 reads its settings from this file, NOT from .npmrc, so the three
# settings the project requires - strict engine checking, automatic peer
# installation and pre/post lifecycle scripts - live here.
# (.npmrc keeps the same keys for npm and for older pnpm versions.)
engineStrict: true
autoInstallPeers: true
# Run pre*/post* lifecycle scripts, which three hooks depend on: the
# apps/chrome-extension `prebuild`/`predev` copy the browser-agent bundle
# (scripts/copy-agent.mjs), the packages/panel-renderer `prebuild` regenerates
# tokens.css, and apps/demo-app runs `prisma generate` from both `prebuild` and
# `pretypecheck`. `true` is also pnpm's default, so this line changes no
# behaviour today; it is what makes the requirement observable (`pnpm config get
# enablePrePostScripts` prints it) and holds it against a future default flip,
# which .npmrc cannot do - pnpm 12.4.2 does not read that file's npm-style
# `enable-pre-post-scripts`, and setting this key to `false` here is what
# actually skips the three hooks.
enablePrePostScripts: true

# NODE_OPTIONS for every script pnpm runs, which is where the one measured memory
# requirement lives so that no script has to carry a runtime flag or a path into
# node_modules. `pnpm lint` is exactly `eslint . --max-warnings 0` (AAP 0.8.5), and
# its type-aware pass holds every project's TypeScript program in one process: on
# the full tree it aborts with "JavaScript heap out of memory" under Node 24's
# default ~4 GiB heap and completes with this 8 GiB ceiling. A ceiling is not an
# allocation - a process that never approaches 4 GiB behaves exactly as before.
#
# pnpm replaces NODE_OPTIONS with this value rather than merging it, so the
# inherited value is spliced back in through `${NODE_OPTIONS}`, which pnpm expands
# from the environment when it reads this file: `--trace-warnings`, `--inspect` or a
# developer's own `--import` still reach every script, and a caller's own
# `--max-old-space-size` wins because Node applies the last occurrence. Unset, it
# expands to nothing. The product code that launches instrumented dev servers
# (apps/local-service/src/dev-server/launcher.ts, scripts/dev-instrumented.mjs)
# appends its `--import` of the telemetry preload to whatever arrives here, and
# never replaces it.
nodeOptions: "--max-old-space-size=8192 ${NODE_OPTIONS}"

# Dependency lifecycle scripts stay blocked unless they are allowlisted here, so
# every entry below is a deliberate permission for third-party code to run at
# install time and the list is kept to the packages that need one. `allowBuilds`
# is the only live allowlist under the pinned pnpm 12.4.2: it replaced
# `onlyBuiltDependencies` in pnpm 11, and that key has been silently ignored
# since, so it is deliberately not carried here as a fallback. `pnpm install` is
# what keeps this list complete, and it needs no separate audit step: a
# dependency that declares an install script and is not named here fails the
# install outright - `Error: ERR_PNPM_IGNORED_BUILDS`, `Ignored build scripts:
# <name>@<version>`, exit 1 - so adding or upgrading a dependency either
# installs clean or tells you exactly which entry to add below, with a rationale
# like the ones above. What pnpm applied is readable back from
# node_modules/.modules.yaml, which carries `allowBuilds` and `pendingBuilds`
# after every install and an `ignoredBuilds` array only when a script was
# skipped. `pnpm ignored-builds` is NOT that check - it reports the ignored set
# alone, and for the empty set (this repository's state) it prints "Cannot
# identify as no node_modules found" even with node_modules installed, so it can
# neither enumerate nor reconcile the list below - and `pnpm approve-builds`
# only edits it interactively, failing `IO error: not a terminal` off a TTY.
allowBuilds:
  # postinstall places the Prisma engine binaries the CLI needs for
  # `pnpm demo:generate` (`prisma generate`), which `build` and `typecheck` run first.
  "@prisma/engines": true
  # postinstall installs the signing binary `@vscode/vsce` needs to package the VSIX.
  "@vscode/vsce-sign": true
  # postinstall (`node install.js`) puts the platform esbuild binary in place. 0.28.2 is
  # the root devDependency used by the extension and agent bundlers, and the `overrides`
  # block below holds tsup's transitive copy at that same version, so exactly one
  # esbuild version is resolved and one binary is installed.
  esbuild: true
  # preinstall runs the Prisma CLI's platform check before any `prisma` command.
  prisma: true

# Deliberately absent: @prisma/client, @prisma/instrumentation, playwright,
# @playwright/test and @vscode/vsce declare no install script at their pinned
# versions, and Playwright's browsers are fetched by an explicit
# `playwright install` step rather than at install time.

# Transitive resolutions this workspace forces, and the advisory ledger for the
# installed dependency graph: one entry per advisory that `pnpm audit` reported
# against a version some upstream range resolved to, each naming the advisory it
# closes and the path the vulnerable copy arrived by. None of them can be fixed in
# a manifest, because none of the five is a dependency any workspace declares at
# the vulnerable version - they are pulled in by prisma, by @vscode/test-cli's
# mocha and by tsup - so the frozen dependency inventory (AAP 0.3.2) is unchanged
# by this block: `diff` and `esbuild` are forced to exactly the versions
# packages/instrumentation and the root manifest already pin, which collapses each
# of those to a single resolved version, and the other three are transitive-only.
#
# Exact versions, as every manifest pin is exact: a range would let the installed
# graph drift between two installs of one commit. The policy these entries
# implement is that the graph carries no known-vulnerable version - an advisory is
# closed by an entry here, by an upgrade of the package that owns the range, or by
# an explicit review recorded alongside it, never by being left to a warning. So
# adding or upgrading a dependency means re-running `pnpm audit` and reconciling
# this block with what it reports; an entry whose upstream range has moved past the
# patched version stops being load-bearing and should be deleted, and the same
# command proves that either way.
#
# THE GATE THAT ENFORCES THIS: the committed lockfile audits clean, and every
# lockfile change is re-checked by
#
#   pnpm audit --audit-level=low
#
# which runs as the blocking "Audit dependencies" step of the `verify` job in
# .github/workflows/ci.yml, directly after `pnpm install --frozen-lockfile`. Any
# advisory at or above `low` fails that job until it is reconciled here. It is
# deliberately NOT a root script and not part of the `verify` script: AAP 0.7.1
# Group 0 fixes the root script list and AAP 0.8.5 defines `verify` exactly once,
# and `verify` must stay runnable offline, which an audit call is not - so run the
# same command locally before pushing a dependency change. A reviewed advisory -
# one accepted rather than eliminated - is recorded here beside the overrides as a
# comment carrying its GHSA id, the reason it is accepted and the date, so the
# exception is reviewable in the pull request that adds it; there is none today.
overrides:
  # GHSA-ggr8-5vv4-36mx (high): stack exhaustion when merging recursive object
  # graphs, patched in 8.0.0. Arrives as prisma -> @prisma/config -> deepmerge-ts,
  # which every `prisma generate` loads, so it is in the path of `pnpm build` and
  # `pnpm typecheck` through `demo:generate`. 8.0.2 keeps the `deepmerge` named
  # export @prisma/config destructures and the same dual CJS/ESM entry points.
  deepmerge-ts: "8.0.2"
  # GHSA-73rr-hh4g-fpgx (low): denial of service in `parsePatch`/`applyPatch`,
  # patched in 8.0.3. Arrives as @vscode/test-cli -> mocha -> diff@7, the diff the
  # Mocha reporter renders for a failed assertion. 9.0.0 is the version
  # packages/instrumentation pins for its unified modification diffs (AAP 0.3.2),
  # so this leaves one copy in the graph, and it still exports the `createPatch`
  # and `diffWordsWithSpace` entry points that reporter calls.
  diff: "9.0.0"
  # GHSA-g7r4-m6w7-qqqr (low): arbitrary file read from the development server on
  # Windows, affecting 0.27.3 - 0.28.0 and patched in 0.28.1. Arrives twice through
  # tsup (directly and through bundle-require). 0.28.2 is the root devDependency
  # (AAP 0.3.2) that apps/vscode-extension/esbuild.mjs and the two telemetry
  # bundlers already run, so tsup builds against the same esbuild the rest of the
  # repository does.
  esbuild: "0.28.2"
  # GHSA-3f6p-5ww8-9rcr (high): authentication-plugin downgrade to
  # mysql_clear_password leaking plaintext credentials, patched in 3.22.0; and
  # GHSA-rgwj-5xj2-c3m3 (moderate): unbounded zlib inflate in the compressed
  # protocol handler, patched in 3.23.1. Arrives as prisma -> mysql2, the CLI's
  # MySQL connector, which this project never uses - the demo speaks to PostgreSQL
  # through @prisma/adapter-pg - but the copy is installed all the same.
  mysql2: "3.24.4"
  # GHSA-5c6j-r48x-rmvq (high): remote code execution via `RegExp.flags` and
  # `Date.prototype.toISOString`, patched in 7.0.3; and GHSA-qj8w-gfj5-8c6v
  # (moderate): CPU-exhaustion denial of service from crafted array-like objects,
  # patched in 7.0.5. Arrives as @vscode/test-cli -> mocha -> serialize-javascript,
  # which Mocha uses to hand run options to its worker pool under `--parallel`.
  # 7.1.1 keeps the single-function `serialize(value, options)` API that call site
  # uses and requires Node >= 20, satisfied by the pinned Node 24.21.0.
  serialize-javascript: "7.1.1"
