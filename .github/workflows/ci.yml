# The repository's only workflow (AAP 0.7.1 Group 0). Every gate runs through a root
# package.json script, every action is pinned by commit SHA, no secret is consumed (all
# tests use the deterministic provider), and no step caches, archives or uploads `.git`.
name: CI

on:
  push:
    branches: [master, blitzy]
  pull_request:
    branches: [master, blitzy]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The two jobs are deliberately independent so the e2e acceptance evidence is not
# queued behind the aggregate gate. A reviewer may add `needs: verify` to save
# runner minutes without changing behaviour.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Credential-free on purpose: prisma generate and next build never connect,
      # and a credential here would need a check:secrets allowlist entry.
      DATABASE_URL: postgresql://localhost:5432/placeholder
      DEBUGGEN_PROVIDER: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Aggregate quality gate
        run: pnpm verify

      - name: Extension-host tests
        run: xvfb-run -a pnpm test:vscode

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Mirrors docker-compose.yml (service name included); Compose is not invoked.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: debuggen
          POSTGRES_PASSWORD: debuggen
          POSTGRES_DB: lumen_supply
        ports: ["5432:5432"]
        options: '--health-cmd "pg_isready -U debuggen" --health-interval 5s --health-timeout 5s --health-retries 10'
    # DEBUGGEN_HOME is set on the two Playwright steps, the only ones that start the
    # service, because the `runner` context is not available in job-level env.
    env:
      DATABASE_URL: postgresql://debuggen:debuggen@localhost:5432/lumen_supply
      DEBUGGEN_PROVIDER: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Also runs the prebuild hooks that produce the unpacked Chrome extension and the
      # service bundle playwright.config.ts loads; Playwright starts the service itself.
      - name: Build workspaces
        run: pnpm build

      - name: Prepare demo database
        run: |
          pnpm demo:migrate
          pnpm demo:seed

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser
        env:
          DEBUGGEN_HOME: ${{ runner.temp }}/debuggen

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          DEBUGGEN_HOME: ${{ runner.temp }}/debuggen

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
